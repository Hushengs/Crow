services:
  mysql:
    image: mysql:8.4
    container_name: crow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: kratos
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_system_setup.sql:/docker-entrypoint-initdb.d/01_mysql_system_setup.sql:ro
      - ./mysql_business_setup.sql:/docker-entrypoint-initdb.d/02_mysql_business_setup.sql:ro
      - ./mysql_vod_setup.sql:/docker-entrypoint-initdb.d/03_mysql_vod_setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  golang:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crow-golang
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GOPROXY: https://goproxy.cn,direct
      TZ: Asia/Shanghai
    working_dir: /app
    volumes:
      - .:/app
      - go_pkg_mod:/go/pkg/mod
      - crow_web_node_modules:/app/web/node_modules
    ports:
      - "8000:8000"
      - "9000:9000"
      - "5173:5173"
    command: ["bash", "/app/docker-start.sh"]

  nginx:
    image: nginx:1.27-alpine
    container_name: crow-nginx
    restart: unless-stopped
    depends_on:
      - golang
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  go_pkg_mod:
  crow_web_node_modules:
